<form data-ng-submit="save()" class="noMargin" name="editTaskStatusForm" data-ng-class="{'state-wait': processing }"
    novalidate>
    <div class="modal-header">
        <h3 class="modal-title col-md-9"  data-ng-bind="::header"></h3>
        <button type="button" class="close" data-ng-click="cancel()" data-dismiss="modal" aria-label="Close"
            id="close-edit-widget-form-btn">
            <div aria-hidden="true" class="version-button">+</div>
        </button>
    </div>
    <div class="modal-body">
        <div>
            <div class="form-group">
                <label for="title" class="control-label">{{'COMPONENTS.VIEW_TEMPLATES.WIDGETS.CHART.TITLE' | translate}}
                </label>
                <input id="title" name="title" type="text" class="form-control" data-ng-model="config.title">
            </div>
            <div class="form-group">
                <label class="control-label" for="jsonValue">Select Field
                    <span class="text-danger">*</span></label>
                <select class="form-control" name="jsonValue" id="jsonValue"
                    data-ng-options="field.name as field.title for field in jsonFields" ng-model="config.jsonField" required>
                    <option value="">{{'COMPONENTS.FILTER.CONDITIONAL.SELECT_A_FIELD' | translate}}</option>
                </select>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button id="edit-widget-save" type="submit" class="btn btn-sm btn-primary"><i
                class="icon icon-check margin-right-sm"></i>Save</button>
        <button id="edit-widget-cancel" type="button" class="btn btn-sm btn-default" data-ng-click="cancel()"><i
                class="icon icon-close margin-right-sm"></i>Close</button>
    </div>
</form>
